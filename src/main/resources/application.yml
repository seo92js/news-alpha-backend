spring:
  application:
    name: news-alpha-backend
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:postgresql://${POSTGRE_DB_HOST:localhost}:5432/news_db
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  ai:
    vectorstore:
      type: pgvector
      pgvector:
        index-type: none
        distance-type: cosine_distance
        dimensions: 1536
        table-name: news_vector
        schema-name: public
        initialize-schema: true
    openai:
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small

naver:
  news:
    supported-domains:
      - https://n.news.naver.com/
      - https://sports.news.naver.com/
      - https://entertain.naver.com/
